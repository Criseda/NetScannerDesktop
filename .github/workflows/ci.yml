name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Test
        run: dotnet test Tests/NetScannerDesktop.Tests

      # Also fetches and checksum-verifies the pinned engine.
      - name: Build app
        run: msbuild NetScannerDesktop/NetScannerDesktop.csproj /restore /m /nologo /v:m /p:Configuration=Release /p:Platform=x64
